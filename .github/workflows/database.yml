name: Database

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Digite RESET para confirmar a destruição do banco
        required: true
        type: string

concurrency:
  group: database
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_DIR: /opt/fresh/app
    steps:
      - uses: actions/checkout@v5

      - name: Confirm
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "RESET" ]; then
            echo "Confirmação inválida: esperado 'RESET'." >&2
            exit 1
          fi

      - name: Configure SSH
        uses: ./.github/actions/configure-ssh
        with:
          ssh-key: ${{ secrets.EC2_SSH_KEY }}
          ssh-host: ${{ secrets.EC2_HOST }}
          ssh-fingerprint: ${{ secrets.EC2_SSH_HOST_FINGERPRINT }}

      - name: Ship database files
        env:
          SSH_USER: ${{ secrets.EC2_USER }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
        run: |
          rsync -az -e "ssh -i ~/.ssh/deploy_key" db/ "$SSH_USER@$SSH_HOST:$APP_DIR/db/"
          rsync -az -e "ssh -i ~/.ssh/deploy_key" docker-compose.yml "$SSH_USER@$SSH_HOST:$APP_DIR/docker-compose.yml"

      - name: Recreate container
        env:
          SSH_USER: ${{ secrets.EC2_USER }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "APP_DIR='$APP_DIR' bash -s" < deploy/scripts/reset-db.sh
