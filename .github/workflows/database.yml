name: Database

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Digite RESET para confirmar a destruição do banco
        required: true
        type: string

concurrency:
  group: database
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    env:
      APP_DIR: ${{ vars.APP_DIR_PROD || '/opt/fresh/app' }}
    steps:
      - uses: actions/checkout@v5

      - name: Confirm
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "RESET" ]; then
            echo "Confirmação inválida: esperado 'RESET'." >&2
            exit 1
          fi

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ship database files
        env:
          SSH_USER: ${{ secrets.EC2_USER }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
        run: |
          rsync -az -e "ssh -i ~/.ssh/deploy_key" db/ "$SSH_USER@$SSH_HOST:$APP_DIR/db/"
          rsync -az -e "ssh -i ~/.ssh/deploy_key" docker-compose.yml "$SSH_USER@$SSH_HOST:$APP_DIR/docker-compose.yml"

      - name: Recreate container
        env:
          SSH_USER: ${{ secrets.EC2_USER }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "APP_DIR='$APP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"

          docker compose down -v --remove-orphans
          docker compose up -d --wait postgres

          for svc in fresh fresh-dev; do
            if systemctl list-unit-files "$svc.service" >/dev/null 2>&1; then
              sudo systemctl restart "$svc" || true
            fi
          done

          for pair in "fresh 8000" "fresh-dev 8001"; do
            svc=${pair% *}
            port=${pair#* }
            if systemctl list-unit-files "$svc.service" >/dev/null 2>&1; then
              healthy=0
              for _ in $(seq 1 15); do
                if curl -fsS -o /dev/null "http://localhost:$port/health"; then
                  healthy=1
                  break
                fi
                sleep 2
              done
              if [ "$healthy" -ne 1 ]; then
                echo "Health check failed for $svc on port $port" >&2
                exit 1
              fi
            fi
          done

          echo "Database recreated with migrations and seed"
          REMOTE
