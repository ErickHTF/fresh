name: App

on:
  workflow_dispatch:

concurrency:
  group: app
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:13.22
        env:
          POSTGRES_DB: fresh_quiz
          POSTGRES_USER: fresh
          POSTGRES_PASSWORD: fresh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fresh -d fresh_quiz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://fresh:fresh@localhost:5432/fresh_quiz
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: deno-${{ runner.os }}-
      - run: deno install --frozen
      - run: deno task db:migrate
      - run: deno task check
      - run: deno task test
      - run: deno task build
      - uses: actions/upload-artifact@v4
        with:
          name: fresh-build
          path: _fresh
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_DIR: /opt/fresh/app
      SERVICE: fresh
      PORT: "8000"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: fresh-build
          path: _fresh

      - name: Configure SSH
        uses: ./.github/actions/configure-ssh
        with:
          ssh-key: ${{ secrets.EC2_SSH_KEY }}
          ssh-host: ${{ secrets.EC2_HOST }}
          ssh-fingerprint: ${{ secrets.EC2_SSH_HOST_FINGERPRINT }}

      - name: Write env file
        run: |
          [ -n "$DATABASE_URL" ] || { echo "DATABASE_URL ausente" >&2; exit 1; }
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env.production

      - name: Ship release
        env:
          SSH_USER: ${{ secrets.EC2_USER }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" _fresh/ "$SSH_USER@$SSH_HOST:$APP_DIR/_fresh.next/"
          rsync -az -e "ssh -i ~/.ssh/deploy_key" deploy/ "$SSH_USER@$SSH_HOST:$APP_DIR/deploy/"
          rsync -az --chmod=F600 -e "ssh -i ~/.ssh/deploy_key" .env.production "$SSH_USER@$SSH_HOST:$APP_DIR/.env"

      - name: Restart and verify
        env:
          SSH_USER: ${{ secrets.EC2_USER }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "APP_DIR='$APP_DIR' SERVICE='$SERVICE' PORT='$PORT' bash -s" < deploy/scripts/deploy-app.sh
