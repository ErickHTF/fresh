name: App

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente de destino
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

concurrency:
  group: app-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13.22
        env:
          POSTGRES_DB: fresh_quiz
          POSTGRES_USER: fresh
          POSTGRES_PASSWORD: fresh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fresh -d fresh_quiz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://fresh:fresh@localhost:5432/fresh_quiz
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno install --frozen
      - run: deno task db:migrate
      - run: deno task check
      - run: deno task test
      - run: deno task build
      - uses: actions/upload-artifact@v4
        with:
          name: fresh-build
          path: _fresh
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      APP_DIR: ${{ inputs.environment == 'prod' && (vars.APP_DIR_PROD || '/opt/fresh/app') || (vars.APP_DIR_DEV || '/opt/fresh/app-dev') }}
      SERVICE: ${{ inputs.environment == 'prod' && 'fresh' || 'fresh-dev' }}
      PORT: ${{ inputs.environment == 'prod' && '8000' || '8001' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: fresh-build
          path: _fresh

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Write env file
        run: printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env.production

      - name: Ship release
        env:
          SSH_USER: ${{ secrets.EC2_USER }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" _fresh/ "$SSH_USER@$SSH_HOST:$APP_DIR/_fresh.next/"
          rsync -az -e "ssh -i ~/.ssh/deploy_key" deploy/ "$SSH_USER@$SSH_HOST:$APP_DIR/deploy/"
          rsync -az -e "ssh -i ~/.ssh/deploy_key" .env.production "$SSH_USER@$SSH_HOST:$APP_DIR/.env"

      - name: Restart and verify
        env:
          SSH_USER: ${{ secrets.EC2_USER }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "APP_DIR='$APP_DIR' SERVICE='$SERVICE' PORT='$PORT' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"

          rm -rf _fresh.previous
          if [ -d _fresh ]; then mv _fresh _fresh.previous; fi
          mv _fresh.next _fresh

          sudo systemctl restart "$SERVICE"

          healthy=0
          for _ in $(seq 1 15); do
            if curl -fsS -o /dev/null "http://localhost:$PORT/health"; then
              healthy=1
              break
            fi
            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            echo "Health check failed on port $PORT; rolling back" >&2
            rm -rf _fresh.failed
            mv _fresh _fresh.failed
            if [ -d _fresh.previous ]; then mv _fresh.previous _fresh; fi
            sudo systemctl restart "$SERVICE"
            exit 1
          fi

          echo "App healthy: $SERVICE on port $PORT"
          REMOTE
