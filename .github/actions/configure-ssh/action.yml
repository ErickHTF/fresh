name: Configure SSH
description: Instala a chave de deploy e prepara o known_hosts para a EC2

inputs:
  ssh-key:
    description: Chave privada SSH de deploy
    required: true
  ssh-host:
    description: Host da EC2
    required: true
  ssh-fingerprint:
    description: Fingerprint SHA256 esperado do host (opcional; sem ele, confia no keyscan)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      env:
        SSH_KEY: ${{ inputs.ssh-key }}
        SSH_HOST: ${{ inputs.ssh-host }}
        SSH_FINGERPRINT: ${{ inputs.ssh-fingerprint }}
      run: bash "${{ github.action_path }}/configure-ssh.sh"
