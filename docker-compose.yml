services:
  postgres:
    image: postgres:13.22
    restart: unless-stopped
    environment:
      POSTGRES_DB: fresh_quiz
      POSTGRES_USER: fresh
      POSTGRES_PASSWORD: fresh
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init/01-setup.sh:/docker-entrypoint-initdb.d/01-setup.sh:ro
      - ./db/migrations:/migrations:ro
      - ./db/seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fresh -d fresh_quiz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
